{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card mx-auto">
<h2 class="fw-bold mb-2">Create Patient Account</h2><p class="text-muted mb-4">Register to book and manage appointments.</p>
<form method="post">{% csrf_token %}
  {% for field in form %}
    <div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}
      {% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
    </div>
  {% endfor %}
  <button class="btn btn-primary w-100">Create Account</button>
</form>
</div></div>
{% endblock %}
