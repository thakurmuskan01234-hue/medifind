{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card mx-auto">
<h2 class="fw-bold mb-2">Welcome Back</h2><p class="text-muted mb-4">Login to manage your appointments.</p>
<form method="post">{% csrf_token %}
  <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="text-center mt-3 mb-0">New patient? <a href="{% url 'register' %}">Create account</a></p>
</div></div>
{% endblock %}
