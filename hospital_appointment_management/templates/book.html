{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}
{% block content %}
<div class="container py-5"><div class="form-card mx-auto">
<h2 class="fw-bold">Book an Appointment</h2><p class="text-muted mb-4">Select a doctor, date and time.</p>
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}</label>{{ field }}
{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}</div>
{% endfor %}
<button class="btn btn-primary w-100">Confirm Booking</button>
</form>
</div></div>
{% endblock %}
